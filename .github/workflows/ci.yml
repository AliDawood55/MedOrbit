name: MedOrbit CI

on:
  push:
    branches:
      - main
      - ALI
      - omar

  pull_request:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env
        run: |
          cat <<EOF > .env
          PORT=3001
          NODE_ENV=production

          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_SCHEMA=medorbit

          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_ACCESS_EXPIRES_IN=15m
          JWT_REFRESH_EXPIRES_IN=7d

          BCRYPT_ROUNDS=12

          CORS_ORIGIN=http://localhost:8080,http://127.0.0.1:8080

          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}

          AI_SERVICE_URL=http://localhost:8001
          AI_SERVICE_TIMEOUT_MS=90000

          EMAIL_HOST=smtp.gmail.com
          EMAIL_PORT=587
          EMAIL_SECURE=false
          EMAIL_USER=${{ secrets.EMAIL_USER }}
          EMAIL_PASS=${{ secrets.EMAIL_PASS }}
          EMAIL_FROM=${{ secrets.EMAIL_USER }}

          FRONTEND_URL=http://localhost:8080/public

          OLLAMA_URL=http://host.docker.internal:11434/api/generate
          OLLAMA_MODEL=qwen2:7b
          EOF

      - name: Build Docker Images
        run: docker compose build

      - name: Start Containers
        run: docker compose up -d

      - name: Show running containers
        run: docker compose ps

      # A single curl after a fixed sleep isn't reliable: startup time varies
      # with runner load, and (as diagnosed 2026-07-31) a genuine crash loop
      # can make the port come up and go down repeatedly, so one lucky/unlucky
      # sample either passes or fails without telling you which. Poll instead,
      # and print each attempt so a real failure is easy to read from the log.
      - name: Backend Health Check
        run: |
          for i in $(seq 1 24); do
            if curl --fail -s -o /dev/null http://localhost:3001/api/health; then
              echo "Backend healthy after ${i} attempt(s) (~$(( (i - 1) * 5 ))s)"
              exit 0
            fi
            echo "Attempt ${i}/24: backend not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "Backend did not become healthy within 120s"
          exit 1

      - name: AI Service Health Check
        run: |
          for i in $(seq 1 24); do
            if curl --fail -s -o /dev/null http://localhost:8001/health; then
              echo "AI service healthy after ${i} attempt(s) (~$(( (i - 1) * 5 ))s)"
              exit 0
            fi
            echo "Attempt ${i}/24: AI service not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "AI service did not become healthy within 120s"
          exit 1

      - name: Show Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Shutdown
        if: always()
        run: docker compose down -v