name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, user-service, doctor-service]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: medorbit
          POSTGRES_PASSWORD: medorbit
          POSTGRES_DB: medorbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medorbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      DATABASE_URL: postgres://medorbit:medorbit@localhost:5432/medorbit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all service images
        run: docker compose build
