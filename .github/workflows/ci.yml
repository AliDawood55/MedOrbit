name: MedOrbit CI

on:
  push:
    branches: [main, ALI, omar]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Run tests (if exist)
        working-directory: backend
        run: npm test
        continue-on-error: true
