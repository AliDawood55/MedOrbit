name: MedOrbit CI

on:
  push:
  pull_request:

jobs:
  frontend-auth-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify HTTPS same-origin authentication routing
        run: node frontend/tests/api-origin.test.js

  backend-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env
        run: |
          cat <<EOF > .env
          PORT=3001
          NODE_ENV=production

          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=medorbit
          DB_USER=postgres
          DB_PASSWORD=medorbit_ci_password
          DB_SCHEMA=medorbit

          JWT_SECRET=ci-only-not-a-production-secret-please-change
          JWT_ACCESS_EXPIRES_IN=15m
          JWT_REFRESH_EXPIRES_IN=7d

          BCRYPT_ROUNDS=12

          CORS_ORIGIN=http://localhost:8080,http://127.0.0.1:8080

          GOOGLE_CLIENT_ID=ci-test-client.apps.googleusercontent.com

          AI_SERVICE_URL=http://localhost:8001
          AI_SERVICE_TIMEOUT_MS=90000

          EMAIL_HOST=smtp.gmail.com
          EMAIL_PORT=587
          EMAIL_SECURE=false
          EMAIL_USER=ci@medorbit.test
          EMAIL_PASS=ci-email-password-not-used
          EMAIL_FROM=ci@medorbit.test

          FRONTEND_URL=http://localhost:8080/public

          OLLAMA_URL=http://host.docker.internal:11434/api/generate
          OLLAMA_MODEL=qwen2:7b
          EOF

      - name: Build Docker Images
        # Profile-only services are not built by a plain `docker compose
        # build`.  The integration suite starts backend-test and
        # ai-service-test with --no-build, so build that profile explicitly
        # before the suite starts.
        run: |
          docker compose build
          docker compose --profile test build

      - name: Start Fresh Database
        run: docker compose up -d --wait postgres

      - name: Bootstrap Base Schema
        run: docker compose --profile tools run --rm --no-deps db-bootstrap

      - name: Apply Database Migrations
        run: docker compose --profile tools run --rm --no-deps db-migrate up

      - name: Verify Database Bootstrap
        run: |
          docker compose exec -T postgres sh -c \
            'psql --no-psqlrc --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set ON_ERROR_STOP=1' \
            < scripts/ci/verify-bootstrap.sql

      - name: Backend integration test gate
        run: |
          bash scripts/ci/run-backend-integration-tests.sh

      - name: Start Containers
        run: docker compose up -d --wait --wait-timeout 180

      - name: Show running containers
        run: docker compose ps

      # A single curl after a fixed sleep isn't reliable: startup time varies
      # with runner load, and (as diagnosed 2026-07-31) a genuine crash loop
      # can make the port come up and go down repeatedly, so one lucky/unlucky
      # sample either passes or fails without telling you which. Poll instead,
      # and print each attempt so a real failure is easy to read from the log.
      - name: Backend Health Check
        run: |
          for i in $(seq 1 24); do
            if curl --fail -s -o /dev/null http://localhost:3001/api/health; then
              echo "Backend healthy after ${i} attempt(s) (~$(( (i - 1) * 5 ))s)"
              exit 0
            fi
            echo "Attempt ${i}/24: backend not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "Backend did not become healthy within 120s"
          exit 1

      - name: AI Service Health Check
        run: |
          for i in $(seq 1 24); do
            if curl --fail -s -o /dev/null http://localhost:8001/health; then
              echo "AI service healthy after ${i} attempt(s) (~$(( (i - 1) * 5 ))s)"
              exit 0
            fi
            echo "Attempt ${i}/24: AI service not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "AI service did not become healthy within 120s"
          exit 1

      - name: Show Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Shutdown
        if: always()
        run: docker compose down -v

  ai-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install AI runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-ara poppler-utils \
            libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-core swi-prolog-core
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: AI unit, characterization, symbolic, and safety test gate
        working-directory: ai-service
        run: |
          export PYTHONPATH=".:data/ml/nablus_facility_type${PYTHONPATH:+:$PYTHONPATH}"
          # Most legacy suites are executable unittest modules.  The internal
          # identity-boundary suite uses pytest fixtures and must be collected
          # by pytest rather than executed as a plain Python file.
          find tests -name 'test_*.py' -type f ! -name 'test_virtual_doctor_entitlement_boundary.py' -print | sort | xargs -r -n 1 python
          python -m pytest -q tests/test_virtual_doctor_entitlement_boundary.py
