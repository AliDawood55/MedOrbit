# MedOrbit — Azure VM staging Docker Compose stack
#
# Standalone staging stack (not an overlay on docker-compose.yml). Run with:
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build
#
# Mirrors the local docker-compose.yml (same images, build contexts, and
# healthchecks) with staging-specific differences:
#   - env_file is .env.staging (create it from .env.staging.example)
#   - postgres publishes NO host port — nothing outside the Docker network
#     can reach it; use `docker compose -f docker-compose.staging.yml exec
#     postgres ...` for restore/backup/psql access
#   - separate named volumes (medorbit_pgdata_staging / medorbit_hf_cache_staging)
#     so this never collides with a local dev stack on the same machine
#   - no OLLAMA_URL override — Ollama is intentionally NOT installed on the
#     staging VM yet, so AI-chat features that depend on it (virtual doctor
#     reasoning, symptom/drug-checker LLM calls) will time out/fail on
#     staging until a later phase. Core connectivity/auth/data endpoints are
#     unaffected.
#
# See docs/AZURE_STAGING_DEPLOYMENT.md for the full VM setup + deploy guide.

# STAGING IMAGE NAMESPACE — the same isolation argument as the separate
# *_staging volumes above, applied to images. Compose derives a project name
# from the directory, which is the same directory both compose files live in,
# so without explicit names `docker compose -f docker-compose.staging.yml
# build` produced medorbit-backend / medorbit-frontend / medorbit-ai-service —
# byte-for-byte the tags the local stack uses, built from .env.staging. On a
# machine running both, the staging build silently replaced the local images.
# The container names were already distinct; the image names now are too.
x-backend-image: &backend-image medorbit-backend-staging

x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile

# Shared by the three Kafka workers; per-worker command, health port and
# healthcheck stay spelled out below.
x-worker-env: &worker-env
  DB_HOST: postgres
  DB_PORT: 5432
  NODE_ENV: production
  KAFKA_ENABLED: "true"
  KAFKA_BROKERS: kafka:9092

x-worker-depends: &worker-depends
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy

services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: medorbit-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - medorbit_pgdata_staging:/var/lib/postgresql/data
    # Deliberately no `ports:` — postgres must not be reachable outside the
    # Docker network on a public-facing VM.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:3.9.0
    container_name: medorbit-kafka-staging
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - medorbit_kafka_data_staging:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  backend:
    image: *backend-image
    build: *backend-build
    container_name: medorbit-backend-staging
    restart: unless-stopped
    # server.js registers no SIGTERM handler; as PID 1 Node ignores the signal
    # entirely, so a redeploy waited out the 10s grace period and then killed
    # the container. tini at PID 1 restores the default disposition. Matches
    # the local stack; the workers below handle SIGTERM themselves.
    init: true
    env_file:
      - .env.staging
    environment:
      # Inside the compose network, "postgres"/"ai-service" are the service
      # DNS names, not localhost.
      DB_HOST: postgres
      AI_SERVICE_URL: http://ai-service:8001
      NODE_ENV: production
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: kafka:9092
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      # Persist clinical attachments and generated reports outside the
      # backend container layer. The application working directory is
      # /app/backend, not /app.
      - ./backend/uploads:/app/backend/uploads
      - ./backend/storage:/app/backend/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  ai-service:
    image: medorbit-ai-service-staging
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: medorbit-ai-service-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      DB_HOST: postgres
    # Never publish the AI service; backend-to-AI traffic uses Docker DNS.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - medorbit_hf_cache_staging:/root/.cache/huggingface
      # Piper TTS voices (~60MB each) are downloaded on first use, not tracked
      # in git, and are no longer shipped in the image (.dockerignore). Without
      # this mount they would re-download into the container layer on every
      # redeploy. Same directory the code uses as its own voice cache.
      - ./ai-service/virtual_doctor/assets/tts_voices:/app/virtual_doctor/assets/tts_voices

  outbox-worker:
    image: *backend-image
    build: *backend-build
    container_name: medorbit-outbox-worker-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      <<: *worker-env
      WORKER_HEALTH_PORT: 3002
    command: ["node", "scripts/outbox-worker.js"]
    depends_on: *worker-depends
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  event-consumer:
    image: *backend-image
    build: *backend-build
    container_name: medorbit-event-consumer-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      <<: *worker-env
      WORKER_HEALTH_PORT: 3003
    command: ["node", "scripts/event-consumer.js"]
    depends_on:
      <<: *worker-depends
      outbox-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3003/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  recommendation-consumer:
    image: *backend-image
    build: *backend-build
    container_name: medorbit-recommendation-consumer-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      <<: *worker-env
      KAFKA_RECOMMENDATION_CONSUMER_GROUP: recommendation-profile-v1
      WORKER_HEALTH_PORT: 3004
    command: ["node", "scripts/recommendation-consumer.js"]
    depends_on:
      <<: *worker-depends
      outbox-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3004/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  db-bootstrap:
    image: postgis/postgis:18-3.6
    profiles: ["tools"]
    restart: "no"
    env_file:
      - .env.staging
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      BASELINE_SQL: /bootstrap/base-schema.sql
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts/bootstrap-database.sh:/usr/local/bin/bootstrap-database.sh:ro
      - ./scripts/ci/base-schema.sql:/bootstrap/base-schema.sql:ro
    entrypoint: ["bash", "/usr/local/bin/bootstrap-database.sh"]

  db-migrate:
    image: medorbit-backend-test-staging
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    profiles: ["tools"]
    restart: "no"
    env_file:
      - .env.staging
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_SCHEMA: medorbit
      NODE_ENV: migration
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["node", "scripts/migrate.js"]
    command: ["status"]

  frontend:
    image: medorbit-frontend-staging
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: medorbit-frontend-staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend

  caddy:
    image: caddy:2.8-alpine
    container_name: medorbit-caddy-staging
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      MEDORBIT_PUBLIC_HOST: ${MEDORBIT_PUBLIC_HOST:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - medorbit_caddy_data_staging:/data
      - medorbit_caddy_config_staging:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  medorbit_pgdata_staging:
    name: medorbit_pgdata_staging
  medorbit_hf_cache_staging:
    name: medorbit_hf_cache_staging
  medorbit_kafka_data_staging:
    name: medorbit_kafka_data_staging
  medorbit_caddy_data_staging:
    name: medorbit_caddy_data_staging
  medorbit_caddy_config_staging:
    name: medorbit_caddy_config_staging
