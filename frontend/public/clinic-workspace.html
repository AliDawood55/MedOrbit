<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedOrbit – Clinic workspace</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="../src/css/main.css"><link rel="stylesheet" href="../src/css/components.css"><link rel="stylesheet" href="../src/css/layout.css"><link rel="stylesheet" href="../src/css/forms.css"><link rel="stylesheet" href="../src/css/care.css"><style>html[data-auth-gate="pending"] body>*:not([data-auth-ui]){visibility:hidden!important}</style><script>document.documentElement.setAttribute('data-auth-gate','pending')</script><script src="../src/js/auth-gate.js"></script></head><body class="site-page" data-theme="light"><header class="app-header"><a class="header-brand" href="home.html"><div class="brand-icon"><i class="fas fa-heartbeat"></i></div><div class="brand-text"><span class="brand-name">MedOrbit</span><p>Smart Healthcare AI</p></div></a><nav class="site-nav" id="navLinks"></nav><div class="header-actions"><div id="authArea"></div><button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i></button><button class="icon-btn" id="langToggle"><span id="langLabel">EN</span></button></div></header><main class="page-container" id="main-content"><div class="care-header-row"><div><h1>مساحة المنشأة / Clinic workspace</h1><p class="text-muted">حدّث معلومات المنشأة واربط حسابات الأطباء المعتمدة بها.</p></div><a id="publicClinicLink" class="btn btn-secondary btn-sm" href="#">الصفحة العامة / Public profile</a></div><div class="alert" id="workspaceAlert"></div><section class="care-section"><h2 class="care-section-title"><i class="fas fa-hospital"></i> بيانات المنشأة / Clinic details</h2><form id="clinicWorkspaceForm"><div class="form-row"><div class="form-group"><label>الاسم بالعربية</label><input id="nameAr"></div><div class="form-group"><label>Name in English</label><input id="nameEn" dir="ltr"></div></div><div class="form-row"><div class="form-group"><label>المدينة / City</label><input id="city"></div><div class="form-group"><label>الهاتف / Phone</label><input id="phone" dir="ltr"></div></div><div class="form-row"><div class="form-group"><label>العنوان بالعربية</label><textarea id="addressAr"></textarea></div><div class="form-group"><label>Address in English</label><textarea id="addressEn" dir="ltr"></textarea></div></div><div class="form-group"><label>الخدمات الطبية (افصل بفاصلة)</label><input id="services" placeholder="cardiology, dentistry"></div><div class="care-form-actions"><button class="btn btn-primary">حفظ / Save</button></div></form></section><section class="care-section"><h2 class="care-section-title"><i class="fas fa-user-doctor"></i> أطباء المنشأة / Clinic doctors</h2><div class="form-row"><div class="form-group"><label for="eligibleDoctor">إضافة طبيب معتمد</label><select id="eligibleDoctor"></select></div><div class="form-group"><label>&nbsp;</label><button class="btn btn-primary" id="addDoctor" type="button">إضافة / Add</button></div></div><div id="clinicDoctors"></div></section></main><footer class="site-footer" id="siteFooter"></footer><div class="toast-container" id="toastContainer"></div><script src="../src/utils/store.js"></script><script src="../src/js/api.js"></script><script src="../src/js/i18n.js"></script><script src="../src/js/theme.js"></script><script src="../src/js/toast.js"></script><script src="../src/js/layout.js"></script><script src="../src/js/clinic-workspace.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{Layout.init();ClinicWorkspace.init()})</script></body></html>
