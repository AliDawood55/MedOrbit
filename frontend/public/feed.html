<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MedOrbit – Health Feed</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../src/css/main.css">
  <link rel="stylesheet" href="../src/css/components.css">
  <link rel="stylesheet" href="../src/css/layout.css">
  <link rel="stylesheet" href="../src/css/social.css">
    <!-- Fail-closed shield for this page's shell. Inline on purpose: the gate
         below is an external file and an external file can 404, be blocked or
         time out, and a gate that never loads hides nothing. These lines
         cannot go missing on their own. They hide protected markup from the
         first paint; the gate clears the attribute once it has verified the
         session, and the watchdog leaves for Home if the gate never arrives. -->
    <style>html[data-auth-gate="pending"] body>*:not([data-auth-ui]),html[data-auth-gate="blocked"] body>*:not([data-auth-ui]){visibility:hidden!important}html[data-auth-gate="pending"] body,html[data-auth-gate="blocked"] body{overflow:hidden!important;background:var(--bg,#F9FAFB)!important}</style>
    <script>(function(){document.documentElement.setAttribute('data-auth-gate','pending');function f(){if(window.__medorbitAuthGateReady||window.__medorbitNavigatingAway)return;location.replace('home.html?auth=unavailable&next='+encodeURIComponent(location.pathname.split('/').pop()+location.search));}window.addEventListener('load',function(){setTimeout(f,0);});setTimeout(f,20000);})();</script>
    <!-- Global authentication gate: must load in <head>, before any
         protected markup is parsed (see frontend/src/js/auth-gate.js). -->
    <script src="../src/js/auth-gate.js"></script>
</head>

<body class="site-page feed-page" data-theme="light">
  <a class="skip-link" href="#main-content" data-i18n="a11y.skipToContent">تجاوز إلى المحتوى الرئيسي</a>
  <header class="app-header">
    <a class="header-brand" id="brandLink" href="home.html">
      <div class="brand-icon">
        <i class="fas fa-heartbeat"></i>
      </div>

      <div class="brand-text">
        <span class="brand-name">MedOrbit</span>
        <p>Smart Healthcare AI</p>
      </div>
    </a>

    <nav class="site-nav" id="navLinks"></nav>

    <div class="header-actions">
      <div class="auth-area" id="authArea"></div>

      <button class="icon-btn" id="themeToggle" data-i18n-title="theme">
        <i class="fas fa-moon"></i>
      </button>

      <button class="icon-btn" id="langToggle" data-i18n-title="language">
        <span id="langLabel">EN</span>
      </button>
    </div>
  </header>

  <main id="main-content" class="page-container feed-shell">
    <h1 class="sr-only" data-i18n="nav.feed">المنشورات الصحية</h1>
    <aside class="feed-rail feed-rail-start" aria-hidden="true"></aside>

    <section class="feed-center">
      <section
        class="composer-card card hidden"
        id="feedComposer"
        data-i18n-aria="feed.composerLabel"
      >
        <div class="composer-header">
          <span class="composer-avatar" id="composerAvatar"></span>
          <span class="composer-name" id="composerName"></span>
        </div>

        <div class="composer-body">
          <textarea
            id="composerBody"
            class="composer-textarea"
            rows="1"
            maxlength="4000"
            dir="auto"
            data-i18n-placeholder="feed.composerPlaceholder"
            data-i18n-aria="feed.composerPlaceholder"
          ></textarea>
        </div>

        <div class="alert" id="composerAlert"></div>

        <div class="composer-footer">
          <select id="composerCategory" class="composer-category" aria-label="Post category">
            <option value="health_tip" data-i18n="doctorPosts.categoryHealthTip"></option>
            <option value="announcement" data-i18n="doctorPosts.categoryAnnouncement"></option>
            <option value="clinic_news" data-i18n="doctorPosts.categoryClinicNews"></option>
            <option value="article" data-i18n="doctorPosts.categoryArticle"></option>
          </select>

          <button type="button" class="btn btn-primary btn-sm" id="composerSubmit">
            <span class="btn-label" data-i18n="feed.publish"></span>
            <span class="spinner spinner-sm btn-spinner"></span>
          </button>
        </div>
      </section>

      <div class="feed-stream" id="feedStream">
        <div id="feedStatusLive" class="sr-only" aria-live="polite"></div>

        <div id="feedSkeleton" class="feed-skeleton">
          <div class="feed-card-skeleton skeleton-block"></div>
          <div class="feed-card-skeleton skeleton-block"></div>
          <div class="feed-card-skeleton skeleton-block"></div>
        </div>

        <div id="feedError" class="error-state hidden">
          <i class="fas fa-triangle-exclamation" aria-hidden="true"></i>
          <h3 data-i18n="feed.errorTitle"></h3>
          <p data-i18n="feed.errorHint"></p>
          <button
            type="button"
            class="btn btn-secondary btn-sm"
            id="feedRetryBtn"
            data-i18n="common.retry"
          ></button>
        </div>

        <div id="feedEmpty" class="empty-state hidden">
          <div class="empty-state-icon">
            <i class="fas fa-newspaper" aria-hidden="true"></i>
          </div>
          <h3 data-i18n="feed.emptyTitle"></h3>
          <p data-i18n="feed.emptyHint"></p>
        </div>

        <section id="feedList" class="feed-list"></section>

        <div class="feed-more">
          <button
            id="feedMore"
            class="btn btn-secondary hidden"
            data-i18n="feed.loadMore"
          ></button>
        </div>
      </div>
    </section>

    <aside class="feed-rail feed-rail-end" aria-hidden="true"></aside>
  </main>

  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <script src="../src/utils/store.js"></script>
  <script src="../src/js/api.js"></script>
  <script src="../src/js/i18n.js"></script>
  <script src="../src/js/theme.js"></script>
  <script src="../src/js/toast.js"></script>
  <script src="../src/js/layout.js"></script>
  <script src="../src/js/feed.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', ( ) => {
      Layout.init();
      SocialFeed.init();
    });
  </script>
</body>

</html>
