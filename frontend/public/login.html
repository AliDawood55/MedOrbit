<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MedOrbit - Smart Healthcare AI Platform">
    <meta name="theme-color" content="#2563EB">
    <title>MedOrbit – تسجيل الدخول</title><link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="../src/css/main.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/forms.css">
    <link rel="stylesheet" href="../src/css/auth.css">
    <!-- Global authentication gate: must load in <head>, before any
         protected markup is parsed (see frontend/src/js/auth-gate.js). -->
    <script src="../src/js/auth-gate.js"></script>
</head>
<body class="site-page" data-theme="light">
  <a class="skip-link" href="#main-content" data-i18n="a11y.skipToContent">تجاوز إلى المحتوى الرئيسي</a>

    <header class="app-header">
        <a class="header-brand" id="brandLink" href="home.html">
            <div class="brand-icon"><i class="fas fa-heartbeat"></i></div>
            <div class="brand-text">
                <span class="brand-name">MedOrbit</span>
                <p data-i18n="brand.tagline">Smart Healthcare AI</p>
            </div>
        </a>
        <nav class="site-nav" id="navLinks"></nav>
        <div class="header-actions">
            <div class="auth-area" id="authArea"></div>
            <button class="icon-btn" id="themeToggle" data-i18n-title="theme" title="الوضع الليلي">
                <i class="fas fa-moon"></i>
            </button>
            <button class="icon-btn" id="langToggle" data-i18n-title="language" title="Language">
                <span id="langLabel">EN</span>
            </button>
        </div>
    </header>

    <main id="main-content" class="auth-page">
        <div class="auth-container">
            <div class="auth-card card">
                <div class="auth-brand">
                    <div class="brand-icon"><i class="fas fa-heartbeat"></i></div>
                    <h1 data-i18n="auth.loginTitle">تسجيل الدخول</h1>
                    <p data-i18n="auth.loginSubtitle">أهلاً بعودتك، سجّل الدخول إلى حسابك</p>
                </div>

                <div class="alert" id="alertBox">
                    <i class="fas fa-circle-exclamation"></i>
                    <span id="alertMsg"></span>
                </div>

                <div class="oauth-block">
                    <div class="google-signin-container" id="googleSignInBtn"></div>
                    <div class="auth-divider">
                        <span data-i18n="auth.orDivider">أو</span>
                    </div>
                </div>

                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="email" data-i18n="auth.email">البريد الإلكتروني</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" name="email" data-i18n-placeholder="auth.emailPlaceholder" placeholder="example@medorbit.com" required autocomplete="email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password" data-i18n="auth.password">كلمة المرور</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" data-i18n-placeholder="auth.passwordPlaceholder" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
                            <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary auth-submit" id="loginBtn">
                        <span class="btn-label" data-i18n="auth.submitLogin">تسجيل الدخول</span>
                        <span class="spinner spinner-sm btn-spinner"></span>
                    </button>
                </form>

                <div class="auth-links">
                    <span data-i18n="auth.noAccount">ليس لديك حساب؟</span>
                    <a href="register.html" data-i18n="auth.register">إنشاء حساب</a>
                    <span class="auth-sep"></span>
                    <a href="forgot-password.html" data-i18n="auth.forgotPassword">نسيت كلمة المرور؟</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="../src/utils/dom.js"></script>
    <script src="../src/utils/format.js"></script>
    <script src="../src/utils/store.js"></script>

    <script src="../src/js/api.js"></script>
    <script src="../src/js/i18n.js"></script>
    <script src="../src/js/theme.js"></script>
    <script src="../src/js/toast.js"></script>
    <script src="../src/js/layout.js"></script>
    <script src="../src/js/google-signin.js"></script>
    <script src="../src/js/auth.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Layout.init();
            GoogleSignIn.init('googleSignInBtn');
        });
    </script>
</body>
</html>
