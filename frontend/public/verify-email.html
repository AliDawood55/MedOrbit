<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MedOrbit - Smart Healthcare AI Platform">
    <meta name="theme-color" content="#2563EB">
    <title>MedOrbit – تفعيل البريد الإلكتروني</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="../src/css/main.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/forms.css">
    <link rel="stylesheet" href="../src/css/auth.css">
    <!-- Global authentication gate: must load in <head>, before any
         protected markup is parsed (see frontend/src/js/auth-gate.js). -->
    <script src="../src/js/auth-gate.js"></script>
</head>
<body class="site-page" data-theme="light">

    <header class="app-header">
        <a class="header-brand" id="brandLink" href="home.html">
            <div class="brand-icon"><i class="fas fa-heartbeat"></i></div>
            <div class="brand-text">
                <h1>MedOrbit</h1>
                <p data-i18n="brand.tagline">Smart Healthcare AI</p>
            </div>
        </a>
        <nav class="site-nav" id="navLinks"></nav>
        <div class="header-actions">
            <div class="auth-area" id="authArea"></div>
            <button class="icon-btn" id="themeToggle" data-i18n-title="theme" title="الوضع الليلي">
                <i class="fas fa-moon"></i>
            </button>
            <button class="icon-btn" id="langToggle" data-i18n-title="language" title="Language">
                <span id="langLabel">EN</span>
            </button>
        </div>
    </header>

    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-card card">
                <div class="auth-brand">
                    <div class="brand-icon"><i class="fas fa-envelope-circle-check"></i></div>
                    <h1 data-i18n="auth.verifyTitle">تفعيل البريد الإلكتروني</h1>
                </div>

                <div class="auth-status">
                    <i class="auth-status-icon loading fas fa-circle-notch fa-spin" id="verifyIcon"></i>
                    <p id="verifyStatus">جارِ التحقق من بريدك الإلكتروني...</p>
                </div>

                <div class="alert" id="alertBox">
                    <i class="fas fa-circle-exclamation"></i>
                    <span id="alertMsg"></span>
                </div>

                <div class="resend-section hidden" id="resendSection">
                    <div class="divider"></div>
                    <p class="resend-title" data-i18n="auth.resend.title">لم يصلك رابط التفعيل؟</p>
                    <form id="resendForm" novalidate>
                        <div class="form-group">
                            <label for="resendEmail" data-i18n="auth.email">البريد الإلكتروني</label>
                            <div class="input-wrapper">
                                <i class="fas fa-envelope"></i>
                                <input type="email" id="resendEmail" name="resendEmail" data-i18n-placeholder="auth.emailPlaceholder" placeholder="example@medorbit.com" required autocomplete="email">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-secondary auth-submit" id="resendBtn">
                            <span class="btn-label" data-i18n="auth.resend.submit">إعادة إرسال رابط التفعيل</span>
                            <span class="spinner spinner-sm btn-spinner"></span>
                        </button>
                    </form>
                </div>

                <div class="auth-links">
                    <a href="login.html" data-i18n="auth.backToLogin">العودة لتسجيل الدخول</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="../src/utils/dom.js"></script>
    <script src="../src/utils/format.js"></script>
    <script src="../src/utils/store.js"></script>

    <script src="../src/js/api.js"></script>
    <script src="../src/js/i18n.js"></script>
    <script src="../src/js/theme.js"></script>
    <script src="../src/js/toast.js"></script>
    <script src="../src/js/layout.js"></script>
    <script src="../src/js/auth.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => Layout.init());
    </script>
</body>
</html>
