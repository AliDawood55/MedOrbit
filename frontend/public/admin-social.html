<!DOCTYPE html>
<html data-auth-gate="pending" lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MedOrbit – Social Moderation</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <link rel="stylesheet" href="../src/css/main.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/social.css">
    <link rel="stylesheet" href="../src/css/admin-social.css">

    <style>
        html[data-auth-gate="pending"] body>*:not([data-auth-ui]),
        html[data-auth-gate="blocked"] body>*:not([data-auth-ui]) {
            visibility: hidden !important;
        }

        html[data-auth-gate="pending"] body,
        html[data-auth-gate="blocked"] body {
            overflow: hidden !important;
            background: var(--bg, #F9FAFB) !important;
        }
    </style>

    <script src="../src/js/auth-bootstrap.js"></script>
    <script src="../src/js/auth-gate.js"></script>
</head>

<body class="site-page admin-social-page" data-theme="light">

    <a
        class="skip-link"
        href="#main-content"
        data-i18n="a11y.skipToContent"
    >
        تجاوز إلى المحتوى الرئيسي
    </a>

    <header class="app-header">
        <a class="header-brand" id="brandLink" href="home.html">
            <div class="brand-icon">
                <i class="fas fa-heartbeat"></i>
            </div>

            <div class="brand-text">
                <span class="brand-name">MedOrbit</span>
                <p>Smart Healthcare AI</p>
            </div>
        </a>

        <nav class="site-nav" id="navLinks"></nav>

        <div class="header-actions">
            <div class="auth-area" id="authArea"></div>

            <button class="icon-btn" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>

            <button class="icon-btn" id="langToggle">
                <span id="langLabel">EN</span>
            </button>
        </div>
    </header>

    <main id="main-content" class="page-container social-shell">

        <section class="social-hero">
            <div>
                <h1 id="adminSocialTitle">
                    إدارة المحتوى / Social Moderation
                </h1>

                <p id="adminSocialSubtitle">
                    Review, approve, reject, or hide doctor posts and comments.
                </p>
            </div>
        </section>

        <div id="moderationAlert" class="alert"></div>

        <section class="card moderation-section">
            <div class="moderation-heading">
                <h2>Doctor Posts</h2>

                <select id="postModerationFilter">
                    <option value="">All</option>
                    <option value="pending">Pending</option>
                    <option value="approved">Approved</option>
                    <option value="hidden">Hidden</option>
                    <option value="rejected">Rejected</option>
                </select>
            </div>

            <div
                id="moderationPosts"
                class="moderation-list"
            ></div>
        </section>

        <section class="card moderation-section">
            <div class="moderation-heading">
                <h2>Comments</h2>

                <select id="commentModerationFilter">
                    <option value="">All</option>
                    <option value="approved">Approved</option>
                    <option value="hidden">Hidden</option>
                    <option value="rejected">Rejected</option>
                </select>
            </div>

            <div
                id="moderationComments"
                class="moderation-list"
            ></div>
        </section>

    </main>

    <footer
        class="site-footer"
        id="siteFooter"
    ></footer>

    <div
        class="toast-container"
        id="toastContainer"
    ></div>

    <script src="../src/utils/store.js"></script>
    <script src="../src/js/api.js"></script>
    <script src="../src/js/i18n.js"></script>
    <script src="../src/js/theme.js"></script>
    <script src="../src/js/toast.js"></script>
    <script src="../src/js/layout.js"></script>
    <script src="../src/js/admin-social.js"></script>
    <script src="../src/js/pages/admin-social.js"></script>

</body>

</html>
