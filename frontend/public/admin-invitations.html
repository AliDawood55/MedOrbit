<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="theme-color" content="#2563EB">
    <title>MedOrbit – Admin Invitations</title><link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../src/css/main.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/experience.css">
    <link rel="stylesheet" href="../src/css/doctor-applications.css">
    <link rel="stylesheet" href="../src/css/admin-invitations.css">
    <!-- Fail-closed shield for this page's shell. Inline on purpose: the gate
         below is an external file and an external file can 404, be blocked or
         time out, and a gate that never loads hides nothing. These lines
         cannot go missing on their own. They hide protected markup from the
         first paint; the gate clears the attribute once it has verified the
         session, and the watchdog leaves for Home if the gate never arrives. -->
    <style>html[data-auth-gate="pending"] body>*:not([data-auth-ui]),html[data-auth-gate="blocked"] body>*:not([data-auth-ui]){visibility:hidden!important}html[data-auth-gate="pending"] body,html[data-auth-gate="blocked"] body{overflow:hidden!important;background:var(--bg,#F9FAFB)!important}</style>
    <script>(function(){document.documentElement.setAttribute('data-auth-gate','pending');function f(){if(window.__medorbitAuthGateReady||window.__medorbitNavigatingAway)return;location.replace('home.html?auth=unavailable&next='+encodeURIComponent(location.pathname.split('/').pop()+location.search));}window.addEventListener('load',function(){setTimeout(f,0);});setTimeout(f,20000);})();</script>
    <!-- Global authentication gate: must load in <head>, before any
         protected markup is parsed (see frontend/src/js/auth-gate.js). -->
    <script src="../src/js/auth-gate.js"></script>
</head>
<body class="site-page admin-invitations-page" data-theme="light">
  <a class="skip-link" href="#main-content" data-i18n="a11y.skipToContent">تجاوز إلى المحتوى الرئيسي</a>
<header class="app-header"><a class="header-brand" href="home.html"><div class="brand-icon"><i class="fas fa-heartbeat"></i></div><div class="brand-text"><span class="brand-name">MedOrbit</span><p data-i18n="brand.tagline"></p></div></a><nav class="site-nav" id="navLinks"></nav><div class="header-actions"><div class="auth-area" id="authArea"></div><button class="icon-btn" id="themeToggle" aria-label="Theme"><i class="fas fa-moon"></i></button><button class="icon-btn" id="langToggle" aria-label="Language"><span id="langLabel">EN</span></button></div></header>
<main id="main-content" class="page-container application-shell">
    <div class="experience-heading"><div><h1 id="invitationTitle">Admin Invitations</h1><p id="invitationSubtitle">Invite verified accounts and manage pending invitations.</p></div></div>
    <section class="experience-card">
        <form class="form-grid" id="adminInvitationForm">
            <div class="form-field"><label for="invitationEmail" id="invitationEmailLabel">Account email</label><input id="invitationEmail" type="email" maxlength="320" required autocomplete="email"></div>
            <div class="form-actions"><button class="btn btn-primary" id="sendInvitation" type="submit"><i class="fas fa-paper-plane"></i><span id="sendInvitationLabel">Send invitation</span></button></div>
        </form>
        <div class="page-feedback hidden" id="invitationFeedback"></div>
        <div class="application-note hidden" id="manualInvitation"><strong id="manualInvitationTitle">Manual delivery link</strong><p id="manualInvitationHint"></p><a id="manualInvitationLink" href="#" target="_blank" rel="noopener"></a></div>
    </section>
    <section class="experience-card admin-invitations-list-card"><div class="application-hero"><h2 id="invitationListTitle">Invitation history</h2><button class="btn btn-ghost btn-sm" id="refreshInvitations" type="button" aria-label="Refresh invitations"><i class="fas fa-rotate"></i></button></div><div class="application-history" id="invitationList"><div class="profile-compact-empty">Loading…</div></div></section>
</main>
<footer class="site-footer" id="siteFooter"></footer><div class="toast-container" id="toastContainer"></div>
<script src="../src/utils/store.js"></script><script src="../src/js/api.js"></script><script src="../src/js/i18n.js"></script><script src="../src/js/theme.js"></script><script src="../src/js/toast.js"></script><script src="../src/js/layout.js"></script><script src="../src/js/admin-invitations.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{Layout.init();AdminInvitations.init();});</script>
</body>
</html>
