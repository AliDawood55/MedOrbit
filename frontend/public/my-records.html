<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MedOrbit - Smart Healthcare AI Platform">
    <meta name="theme-color" content="#2563EB">
    <title>MedOrbit – سجلاتي الطبية</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="../src/css/main.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/listing.css">
    <link rel="stylesheet" href="../src/css/animation.css">
    <link rel="stylesheet" href="../src/css/records.css">
    <!-- Fail-closed shield for this page's shell. Inline on purpose: the gate
         below is an external file and an external file can 404, be blocked or
         time out, and a gate that never loads hides nothing. These lines
         cannot go missing on their own. They hide protected markup from the
         first paint; the gate clears the attribute once it has verified the
         session, and the watchdog leaves for Home if the gate never arrives. -->
    <style>html[data-auth-gate="pending"] body>*:not([data-auth-ui]),html[data-auth-gate="blocked"] body>*:not([data-auth-ui]){visibility:hidden!important}html[data-auth-gate="pending"] body,html[data-auth-gate="blocked"] body{overflow:hidden!important;background:var(--bg,#F9FAFB)!important}</style>
    <script>(function(){document.documentElement.setAttribute('data-auth-gate','pending');function f(){if(window.__medorbitAuthGateReady||window.__medorbitNavigatingAway)return;location.replace('home.html?auth=unavailable&next='+encodeURIComponent(location.pathname.split('/').pop()+location.search));}window.addEventListener('load',function(){setTimeout(f,0);});setTimeout(f,20000);})();</script>
    <!-- Global authentication gate: must load in <head>, before any
         protected markup is parsed (see frontend/src/js/auth-gate.js). -->
    <script src="../src/js/auth-gate.js"></script>
</head>
<body class="site-page" data-theme="light">
  <a class="skip-link" href="#main-content" data-i18n="a11y.skipToContent">تجاوز إلى المحتوى الرئيسي</a>

    <header class="app-header">
        <a class="header-brand" id="brandLink" href="home.html">
            <div class="brand-icon"><i class="fas fa-heartbeat"></i></div>
            <div class="brand-text">
                <span class="brand-name">MedOrbit</span>
                <p data-i18n="brand.tagline">Smart Healthcare AI</p>
            </div>
        </a>
        <nav class="site-nav" id="navLinks"></nav>
        <div class="header-actions">
            <div class="auth-area" id="authArea"></div>
            <button class="icon-btn" id="themeToggle" data-i18n-title="theme" title="الوضع الليلي">
                <i class="fas fa-moon"></i>
            </button>
            <button class="icon-btn" id="langToggle" data-i18n-title="language" title="Language">
                <span id="langLabel">EN</span>
            </button>
        </div>
    </header>

    <main id="main-content" class="page-container my-records-page">

        <div class="page-header">
            <h1 data-i18n="records.title">سجلاتي الطبية</h1>
            <p class="page-subtitle" data-i18n="records.subtitle">السجل الزمني لزياراتك وتشخيصاتك الطبية</p>
        </div>

        <!-- Filters: enabled once the timeline finishes loading -->
        <div class="records-filter-bar" id="recordsFilters">
            <div class="search-field">
                <i class="fas fa-search"></i>
                <input type="text" id="recordSearchInput" disabled data-i18n-placeholder="records.searchPlaceholder" data-i18n-aria="records.searchPlaceholder" placeholder="ابحث في السجلات...">
            </div>
            <select id="recordTypeFilter" disabled>
                <option value="all" data-i18n="records.filterAllTypes">كل الأنواع</option>
                <option value="appointment" data-i18n="records.filterAppointments">المواعيد</option>
                <option value="record" data-i18n="records.filterMedicalRecords">السجلات الطبية</option>
                <option value="prescription" data-i18n="records.filterPrescriptions">الوصفات الطبية</option>
            </select>
            <select id="recordDateFilter" disabled>
                <option value="any" data-i18n="prescriptions.filterAnyDate">أي تاريخ</option>
                <option value="30" data-i18n="prescriptions.filterLast30">آخر 30 يوماً</option>
                <option value="365" data-i18n="prescriptions.filterLastYear">آخر سنة</option>
            </select>
        </div>

        <div class="records-loading hidden" id="recordsLoading">
            <div class="spinner spinner-lg"></div>
            <p data-i18n="common.loading">جاري التحميل...</p>
        </div>

        <div class="records-error hidden" id="recordsError">
            <div class="empty-state-icon"><i class="fas fa-triangle-exclamation"></i></div>
            <h2 data-i18n="common.error">Error</h2>
            <p id="recordsErrorText"></p>
            <button type="button" class="btn btn-secondary btn-sm" id="recordsRetryBtn" data-i18n="common.retry">Retry</button>
        </div>

        <div class="records-data-grid hidden" id="recordsData">
            <div class="records-real-list records-real-timeline" id="recordsList"></div>
            <section class="records-real-detail" id="recordDetail"></section>
        </div>

        <!-- Honest empty state — no history recorded for this patient yet -->
        <div class="records-empty-state" id="recordsEmpty">
            <div class="empty-state-icon"><i class="fas fa-file-waveform"></i></div>
            <h2 data-i18n="records.emptyTitle">لا يوجد سجل طبي بعد</h2>
            <p data-i18n="records.emptyHint">ستظهر هنا مواعيدك وتشخيصاتك ووصفاتك الطبية بمجرد توفرها.</p>
            <a href="dashboard.html" class="btn btn-secondary btn-sm">
                <i class="fas fa-arrow-right"></i>
                <span data-i18n="records.backToDashboard">العودة للوحة التحكم</span>
            </a>
        </div>

    </main>

    <footer class="site-footer" id="siteFooter"></footer>

    <div class="toast-container" id="toastContainer"></div>

    <script src="../src/utils/dom.js"></script>
    <script src="../src/utils/format.js"></script>
    <script src="../src/utils/store.js"></script>
    <script src="../src/utils/motion.js"></script>

    <script src="../src/js/api.js"></script>
    <script src="../src/js/i18n.js"></script>
    <script src="../src/js/theme.js"></script>
    <script src="../src/js/toast.js"></script>
    <script src="../src/js/layout.js"></script>
    <script src="../src/js/my-records.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Layout.init();
            MyRecords.init();
        });
    </script>
</body>
</html>
