<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MedOrbit - Smart Healthcare AI Platform">
    <meta name="theme-color" content="#2563EB">
    <title>MedOrbit – ملف الطبيب</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <link rel="stylesheet" href="../src/css/main.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/listing.css">
</head>
<body class="site-page" data-theme="light">

    <header class="app-header">
        <a class="header-brand" id="brandLink" href="home.html">
            <div class="brand-icon"><i class="fas fa-heartbeat"></i></div>
            <div class="brand-text">
                <h1>MedOrbit</h1>
                <p data-i18n="brand.tagline">Smart Healthcare AI</p>
            </div>
        </a>
        <nav class="site-nav" id="navLinks"></nav>
        <div class="header-actions">
            <div class="auth-area" id="authArea"></div>
            <button class="icon-btn" id="themeToggle" data-i18n-title="theme" title="الوضع الليلي">
                <i class="fas fa-moon"></i>
            </button>
            <button class="icon-btn" id="langToggle" data-i18n-title="language" title="Language">
                <span id="langLabel">EN</span>
            </button>
        </div>
    </header>

    <main class="page-container">
        <a href="find-doctors.html" class="back-link">
            <i class="fas fa-arrow-right"></i> <span data-i18n="doctor.backToList">العودة لقائمة الأطباء</span>
        </a>

        <div id="doctorContent">
            <!-- Rendered by doctor.js: loading / profile / not-found / error -->
        </div>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <script src="../src/utils/dom.js"></script>
    <script src="../src/utils/format.js"></script>
    <script src="../src/utils/store.js"></script>

    <script src="../src/js/api.js"></script>
    <script src="../src/js/i18n.js"></script>
    <script src="../src/js/theme.js"></script>
    <script src="../src/js/toast.js"></script>
    <script src="../src/js/layout.js"></script>
    <script src="../src/js/mini-map.js"></script>
    <script src="../src/js/doctor.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Layout.init();
            DoctorProfile.init();
        });
    </script>
</body>
</html>
