<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify clinic contact email – MedOrbit</title><link rel="stylesheet" href="../src/css/main.css"><link rel="stylesheet" href="../src/css/components.css"><link rel="stylesheet" href="../src/css/forms.css"></head><body class="site-page"><main class="page-container" style="max-width:640px;padding-top:8rem"><section class="care-section"><h1>Verify clinic contact email</h1><p id="message" class="text-muted">Verifying your secure contact-email link…</p><a class="btn btn-primary hidden" id="workspaceLink" href="clinic-workspace.html">Open clinic workspace</a></section></main><script src="../src/utils/store.js"></script><script src="../src/js/api.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const message=document.getElementById('message'),link=document.getElementById('workspaceLink'),token=new URLSearchParams(location.search).get('token');if(!token){message.textContent='This verification link is invalid.';return}try{const response=await API.clinics.verifyContactEmail(token);message.textContent=`Verified ${response.data.email}. You can close this page or return to your clinic workspace.`;link.classList.remove('hidden')}catch(error){message.textContent=error.message||'This verification link is invalid or expired.'}})</script></body></html>
