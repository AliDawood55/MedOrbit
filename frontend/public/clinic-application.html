<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MedOrbit – Clinic application</title><link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../src/css/main.css"><link rel="stylesheet" href="../src/css/components.css"><link rel="stylesheet" href="../src/css/layout.css"><link rel="stylesheet" href="../src/css/forms.css"><link rel="stylesheet" href="../src/css/care.css"><link rel="stylesheet" href="../src/css/clinic-onboarding.css">
  <style>html[data-auth-gate="pending"] body>*:not([data-auth-ui]),html[data-auth-gate="blocked"] body>*:not([data-auth-ui]){visibility:hidden!important}</style>
  <script>document.documentElement.setAttribute('data-auth-gate','pending')</script><script src="../src/js/auth-gate.js"></script>
</head>
<body class="site-page clinic-application-page" data-theme="light">
<a class="skip-link" href="#main-content" data-copy="skip"></a>
<header class="app-header clinic-application-header"><a class="header-brand" href="home.html" aria-label="MedOrbit home"><div class="brand-icon"><i class="fas fa-heartbeat"></i></div><div class="brand-text"><span class="brand-name">MedOrbit</span><p>Smart Healthcare AI</p></div></a><nav class="site-nav" id="navLinks" aria-label="Main navigation"></nav><div class="header-actions"><div class="auth-area" id="authArea"></div><button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle theme"><i class="fas fa-moon"></i></button><button class="icon-btn" id="langToggle" type="button" aria-label="Change language"><span id="langLabel">EN</span></button></div></header>
<main class="page-container clinic-application-content" id="main-content">
  <section class="clinic-application-title"><div class="clinic-title-icon"><i class="fas fa-hospital"></i></div><div><p class="clinic-eyebrow" data-copy="eyebrow"></p><h1 data-copy="title"></h1><p class="text-muted" data-copy="subtitle"></p></div><a class="btn btn-secondary btn-sm" href="dashboard.html" data-copy="account"></a></section>
  <div id="clinicApplicationAlert" class="alert"></div><section id="clinicApplicationState" class="care-section hidden"></section>
  <section id="clinicApplicationFormCard" class="care-section clinic-form-card"><form id="clinicApplicationForm" novalidate>
    <div class="clinic-form-section"><div class="clinic-section-heading"><i class="fas fa-building"></i><div><h2 data-copy="identityTitle"></h2><p data-copy="identityHint"></p></div></div>
      <div class="form-row"><div class="form-group"><label for="clinicNameAr" data-copy="nameAr"></label><input id="clinicNameAr" required></div><div class="form-group"><label for="clinicNameEn" data-copy="nameEn"></label><input id="clinicNameEn" required dir="ltr"></div></div>
      <div class="form-row"><div class="form-group"><label for="clinicAddressAr" data-copy="addressAr"></label><textarea id="clinicAddressAr" required></textarea></div><div class="form-group"><label for="clinicAddressEn" data-copy="addressEn"></label><textarea id="clinicAddressEn" required dir="ltr"></textarea></div></div>
      <div class="form-row"><div class="form-group"><label for="clinicCity" data-copy="city"></label><input id="clinicCity" required></div><div class="form-group"><label for="clinicEmail" data-copy="contactEmail"></label><input id="clinicEmail" type="email" dir="ltr"><p class="field-hint" data-copy="contactEmailHint"></p></div></div>
    </div>
    <div class="clinic-form-section"><div class="clinic-section-heading"><i class="fas fa-clipboard-check"></i><div><h2 data-copy="serviceTitle"></h2><p data-copy="serviceHint"></p></div></div>
      <div class="form-row"><div class="form-group"><label for="clinicType" data-copy="type"></label><select id="clinicType"></select></div><div class="form-group"><label for="registrationNumber" data-copy="registration"></label><input id="registrationNumber" required></div></div><div class="form-group"><label data-copy="services"></label><div id="clinicServices" class="clinic-service-grid"></div></div>
    </div>
    <div class="clinic-form-section"><div class="clinic-section-heading"><i class="fas fa-share-nodes"></i><div><h2 data-copy="linksTitle"></h2><p data-copy="linksHint"></p></div></div><div class="form-row"><div class="form-group"><label for="clinicSocialWebsite">Website</label><input id="clinicSocialWebsite" type="url" placeholder="https://example.com" dir="ltr"></div><div class="form-group"><label for="clinicSocialInstagram">Instagram</label><input id="clinicSocialInstagram" type="url" placeholder="https://instagram.com/..." dir="ltr"></div></div><div class="form-row"><div class="form-group"><label for="clinicSocialTikTok">TikTok</label><input id="clinicSocialTikTok" type="url" placeholder="https://tiktok.com/@..." dir="ltr"></div><div class="form-group"><label for="clinicSocialLinkedIn">LinkedIn</label><input id="clinicSocialLinkedIn" type="url" placeholder="https://linkedin.com/..." dir="ltr"></div></div><div class="form-row"><div class="form-group"><label for="clinicSocialWhatsApp">WhatsApp</label><input id="clinicSocialWhatsApp" type="url" placeholder="https://wa.me/..." dir="ltr"></div><div class="form-group"><label for="clinicSocialFacebook">Facebook</label><input id="clinicSocialFacebook" type="url" placeholder="https://facebook.com/..." dir="ltr"></div></div></div>
    <div class="care-form-actions"><button class="btn btn-primary clinic-submit" id="submitClinicApplication" type="submit"><i class="fas fa-paper-plane"></i><span data-copy="submit"></span></button></div>
  </form></section>
</main><footer class="site-footer" id="siteFooter"></footer><div class="toast-container" id="toastContainer"></div>
<script src="../src/utils/store.js"></script><script src="../src/js/api.js"></script><script src="../src/js/i18n.js"></script><script src="../src/js/theme.js"></script><script src="../src/js/toast.js"></script><script src="../src/js/layout.js"></script><script src="../src/js/clinic-application.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{Layout.init();ClinicApplication.init()})</script>
</body></html>
