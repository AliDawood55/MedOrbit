<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MedOrbit - Smart Healthcare AI Platform">
    <meta name="theme-color" content="#2563EB">
    <title>MedOrbit – طبيبي</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="../src/css/main.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/listing.css">
    <link rel="stylesheet" href="../src/css/animation.css">
    <link rel="stylesheet" href="../src/css/records.css">
    <link rel="stylesheet" href="../src/css/care.css">
    <!-- Fail-closed shield for this page's shell. Inline on purpose: the gate
         below is an external file and an external file can 404, be blocked or
         time out, and a gate that never loads hides nothing. These lines
         cannot go missing on their own. They hide protected markup from the
         first paint; the gate clears the attribute once it has verified the
         session, and the watchdog leaves for Home if the gate never arrives. -->
    <style>html[data-auth-gate="pending"] body>*:not([data-auth-ui]),html[data-auth-gate="blocked"] body>*:not([data-auth-ui]){visibility:hidden!important}html[data-auth-gate="pending"] body,html[data-auth-gate="blocked"] body{overflow:hidden!important;background:var(--bg,#F9FAFB)!important}</style>
    <script>(function(){document.documentElement.setAttribute('data-auth-gate','pending');function f(){if(window.__medorbitAuthGateReady||window.__medorbitNavigatingAway)return;location.replace('home.html?auth=unavailable&next='+encodeURIComponent(location.pathname.split('/').pop()+location.search));}window.addEventListener('load',function(){setTimeout(f,0);});setTimeout(f,20000);})();</script>
    <!-- Global authentication gate: must load in <head>, before any
         protected markup is parsed (see frontend/src/js/auth-gate.js). -->
    <script src="../src/js/auth-gate.js"></script>
</head>
<body class="site-page" data-theme="light">

    <header class="app-header">
        <a class="header-brand" id="brandLink" href="home.html">
            <div class="brand-icon"><i class="fas fa-heartbeat"></i></div>
            <div class="brand-text">
                <h1>MedOrbit</h1>
                <p data-i18n="brand.tagline">Smart Healthcare AI</p>
            </div>
        </a>
        <nav class="site-nav" id="navLinks"></nav>
        <div class="header-actions">
            <div class="auth-area" id="authArea"></div>
            <button class="icon-btn" id="themeToggle" data-i18n-title="theme" title="الوضع الليلي">
                <i class="fas fa-moon"></i>
            </button>
            <button class="icon-btn" id="langToggle" data-i18n-title="language" title="Language">
                <span id="langLabel">EN</span>
            </button>
        </div>
    </header>

    <main class="page-container" style="max-width:900px;">

        <div class="care-restricted hidden" id="restrictedNotice">
            <div class="empty-state-icon"><i class="fas fa-lock"></i></div>
            <h2 data-i18n="care.patientOnlyTitle">هذه الصفحة مخصصة للمرضى</h2>
            <p data-i18n="care.patientOnlyHint">هذه الصفحة متاحة فقط لحسابات المرضى.</p>
            <a href="dashboard.html" class="btn btn-secondary btn-sm">
                <i class="fas fa-arrow-right"></i>
                <span data-i18n="records.backToDashboard">العودة للوحة التحكم</span>
            </a>
        </div>

        <div id="myDoctorContent" class="hidden">

            <div class="page-header">
                <h1 data-i18n="myDoctor.title">طبيبي</h1>
                <p style="color:var(--text-mute);font-size:14px;margin-top:4px;" data-i18n="myDoctor.subtitle">الأطباء المعالجون لك والملاحظات المشتركة معك</p>
            </div>

            <!-- Doctor card(s) -->
            <div class="care-section">
                <div class="care-section-title"><i class="fas fa-user-doctor"></i> <span data-i18n="myDoctor.yourDoctors">أطباؤك</span></div>
                <div id="doctorsList"></div>
            </div>

            <!-- Upcoming appointments with them -->
            <div class="care-section">
                <div class="care-section-title"><i class="fas fa-calendar-check"></i> <span data-i18n="myDoctor.upcomingWithThem">المواعيد القادمة معهم</span></div>
                <div id="upcomingWithThemList"></div>
            </div>

            <!-- Shared notes/sessions — only notes a doctor explicitly
                 marked visible to the patient (medical_records.visible_to_patient). -->
            <div class="care-section">
                <div class="care-section-title"><i class="fas fa-notes-medical"></i> <span data-i18n="myDoctor.sharedNotes">ملاحظات مشتركة</span></div>
                <div id="sharedNotesList"></div>
            </div>

        </div>

    </main>

    <footer class="site-footer" id="siteFooter"></footer>

    <div class="toast-container" id="toastContainer"></div>

    <script src="../src/utils/dom.js"></script>
    <script src="../src/utils/format.js"></script>
    <script src="../src/utils/store.js"></script>
    <script src="../src/utils/motion.js"></script>

    <script src="../src/js/api.js"></script>
    <script src="../src/js/i18n.js"></script>
    <script src="../src/js/theme.js"></script>
    <script src="../src/js/toast.js"></script>
    <script src="../src/js/layout.js"></script>
    <script src="../src/js/my-doctor.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Layout.init();
            MyDoctor.init();
        });
    </script>
</body>
</html>
