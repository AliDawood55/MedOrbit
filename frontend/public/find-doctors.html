<!DOCTYPE html>
<html data-auth-gate="pending" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MedOrbit - Smart Healthcare AI Platform">
    <meta name="theme-color" content="#2563EB">
    <title>MedOrbit – الأطباء</title><link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="../src/css/main.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/listing.css">

<style>html[data-auth-gate="pending"] body>*:not([data-auth-ui]),html[data-auth-gate="blocked"] body>*:not([data-auth-ui]){visibility:hidden!important}html[data-auth-gate="pending"] body,html[data-auth-gate="blocked"] body{overflow:hidden!important;background:var(--bg,#F9FAFB)!important}</style>
    <script src="../src/js/auth-bootstrap.js"></script>

<script src="../src/js/auth-gate.js"></script>
</head>
<body class="site-page" data-theme="light">
  <a class="skip-link" href="#main-content" data-i18n="a11y.skipToContent">تجاوز إلى المحتوى الرئيسي</a>

    <header class="app-header">
        <a class="header-brand" id="brandLink" href="home.html">
            <div class="brand-icon"><i class="fas fa-heartbeat"></i></div>
            <div class="brand-text">
                <span class="brand-name">MedOrbit</span>
                <p data-i18n="brand.tagline">Smart Healthcare AI</p>
            </div>
        </a>
        <nav class="site-nav" id="navLinks"></nav>
        <div class="header-actions">
            <div class="auth-area" id="authArea"></div>
            <button class="icon-btn" id="themeToggle" data-i18n-title="theme" title="الوضع الليلي">
                <i class="fas fa-moon"></i>
            </button>
            <button class="icon-btn" id="langToggle" data-i18n-title="language" title="Language">
                <span id="langLabel">EN</span>
            </button>
        </div>
    </header>

    <main id="main-content" class="page-container find-doctors-page">
        <div class="page-header">
            <h1 data-i18n="doctors.title">الأطباء</h1>
            <p data-i18n="doctors.subtitle">ابحث عن الطبيب المناسب لاحتياجك الصحي</p>
        </div>

        <section id="recommendedDoctorsSection" class="recommended-section" hidden>
            <div class="recommended-header">
                <h2 data-i18n="doctors.recommendedTitle">أطباء مقترحون لك</h2>
                <p data-i18n="doctors.recommendedSubtitle">بناءً على نشاطك واهتماماتك</p>
            </div>
            <div id="recommendedDoctorsContent"></div>
        </section>

        <div class="filter-toolbar">
            <div class="search-field">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" data-i18n-placeholder="doctors.searchPlaceholder" placeholder="ابحث بالاسم...">
            </div>
            <button type="button" class="filter-toggle-btn" id="filterToggleBtn" aria-controls="filterCollapsible" aria-expanded="false">
                <i class="fas fa-sliders"></i> <span data-i18n="doctors.filters">تصفية</span>
            </button>
        </div>
        <section class="doctor-filter-panel" id="filterCollapsible" aria-label="Doctor filters">
                <label class="doctor-filter-control" for="specialtyFilter">
                    <span data-i18n="doctors.specialty">التخصص</span>
                    <select id="specialtyFilter"></select>
                </label>
                <label class="doctor-filter-control doctor-filter-checkbox" for="acceptingFilter">
                    <input type="checkbox" id="acceptingFilter">
                    <span data-i18n="doctors.acceptingOnly">المتاحون لاستقبال مرضى جدد فقط</span>
                </label>
                <label class="doctor-filter-control" for="ratingFilter">
                    <span data-i18n="doctors.rating">التقييم</span>
                    <select id="ratingFilter">
                        <option value="" data-i18n="doctors.anyRating">أي تقييم</option>
                        <option value="4.5" data-i18n="doctors.rating45">4.5 فأعلى</option>
                        <option value="4" data-i18n="doctors.rating4">4.0 فأعلى</option>
                        <option value="3" data-i18n="doctors.rating3">3.0 فأعلى</option>
                    </select>
                </label>
                <fieldset class="doctor-filter-range">
                    <legend data-i18n="doctors.experienceRange">سنوات الخبرة</legend>
                    <div class="doctor-filter-range-inputs">
                        <label><span data-i18n="doctors.from">من</span><input id="minExperienceFilter" type="number" min="0" max="80" inputmode="numeric"></label>
                        <label><span data-i18n="doctors.to">إلى</span><input id="maxExperienceFilter" type="number" min="0" max="80" inputmode="numeric"></label>
                    </div>
                </fieldset>
                <fieldset class="doctor-filter-range">
                    <legend data-i18n="doctors.priceRange">رسوم الكشف</legend>
                    <div class="doctor-filter-range-inputs">
                        <label><span data-i18n="doctors.from">من</span><input id="minFeeFilter" type="number" min="0" max="100000" step="0.01" inputmode="decimal"></label>
                        <label><span data-i18n="doctors.to">إلى</span><input id="maxFeeFilter" type="number" min="0" max="100000" step="0.01" inputmode="decimal"></label>
                    </div>
                </fieldset>
                <button type="button" class="doctor-filter-reset" id="clearFiltersBtn">
                    <i class="fas fa-rotate-left" aria-hidden="true"></i>
                    <span data-i18n="doctors.clearFilters">مسح التصفية</span>
                </button>
        </section>

        <div id="doctorsContent">

        </div>

        <div class="pagination" id="pagination"></div>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>

    <div class="toast-container" id="toastContainer"></div>

    <script src="../src/utils/dom.js"></script>
    <script src="../src/utils/format.js"></script>
    <script src="../src/utils/store.js"></script>

    <script src="../src/js/api.js"></script>
    <script src="../src/js/i18n.js"></script>
    <script src="../src/js/theme.js"></script>
    <script src="../src/js/toast.js"></script>
    <script src="../src/js/layout.js"></script>
    <script src="../src/js/find-doctors.js"></script>

    <script src="../src/js/pages/find-doctors.js"></script>
</body>
</html>
