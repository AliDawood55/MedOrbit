<!DOCTYPE html>
<html data-auth-gate="pending" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#2563EB">
    <title>MedOrbit – Care Messages</title><link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../src/css/main.css"><link rel="stylesheet" href="../src/css/components.css"><link rel="stylesheet" href="../src/css/layout.css"><link rel="stylesheet" href="../src/css/animation.css"><link rel="stylesheet" href="../src/css/direct-messages.css">

<style>html[data-auth-gate="pending"] body>*:not([data-auth-ui]),html[data-auth-gate="blocked"] body>*:not([data-auth-ui]){visibility:hidden!important}html[data-auth-gate="pending"] body,html[data-auth-gate="blocked"] body{overflow:hidden!important;background:var(--bg,#F9FAFB)!important}</style>
    <script src="../src/js/auth-bootstrap.js"></script>

<script src="../src/js/auth-gate.js"></script>
</head>
<body class="site-page direct-messages-page" data-theme="light">
  <a class="skip-link" href="#main-content" data-i18n="a11y.skipToContent">تجاوز إلى المحتوى الرئيسي</a>
    <header class="app-header"><a class="header-brand" href="home.html"><div class="brand-icon"><i class="fas fa-heartbeat"></i></div><div class="brand-text"><span class="brand-name">MedOrbit</span><p data-i18n="brand.tagline"></p></div></a><nav class="site-nav" id="navLinks"></nav><div class="header-actions"><div class="auth-area" id="authArea"></div><button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i></button><button class="icon-btn" id="langToggle"><span id="langLabel">EN</span></button></div></header>
    <main id="main-content" class="page-container messages-page">
        <div class="messages-heading"><div><h1 id="messagesTitle">الرسائل</h1><p id="messagesSubtitle">محادثات نصية خاصة داخل MedOrbit</p></div><div class="messages-heading-actions"><span class="connection-state hidden" id="connectionState" role="status" aria-live="polite"></span><button class="btn btn-primary btn-sm" type="button" id="newConversationBtn"><i class="fas fa-plus"></i><span id="newConversationLabel">رسالة جديدة</span></button></div></div>
        <section class="messages-shell">
            <aside class="conversation-pane"><div class="pane-title" id="conversationListTitle">المحادثات</div><div id="conversationList" class="conversation-list"></div></aside>
            <section class="thread-pane"><div class="thread-header"><button class="icon-btn thread-back" id="threadBackBtn" type="button" aria-label="Back"><i class="fas fa-arrow-right"></i></button><span id="threadName">اختر محادثة</span><span class="role-badge" id="threadRole"></span></div><div class="message-request-banner hidden" id="messageRequestBanner"><div><strong id="requestTitle"></strong><p id="requestHint"></p></div><div class="request-actions" id="requestActions"></div></div><button type="button" class="load-older hidden" id="loadOlderBtn">عرض رسائل أقدم</button><div class="message-history" id="messageHistory" aria-live="polite"><div class="messages-empty" id="threadEmpty">اختر محادثة لعرض الرسائل</div></div><button type="button" class="jump-latest hidden" id="jumpLatestBtn"><i class="fas fa-arrow-down"></i></button><form class="message-composer" id="messageForm"><textarea id="messageInput" maxlength="4000" rows="1" disabled dir="auto"></textarea><button class="btn btn-primary" id="sendMessageBtn" type="submit" disabled><i class="fas fa-paper-plane"></i><span class="btn-label" id="sendLabel">إرسال</span><span class="spinner spinner-sm btn-spinner"></span></button></form></section>
        </section>
        <section class="recipient-picker hidden" id="recipientPicker" aria-labelledby="recipientPickerTitle"><div class="recipient-picker-header"><div><h2 id="recipientPickerTitle">بدء محادثة نصية</h2><p id="recipientPickerHint">ابحث عن طبيب معتمد أو مريض اختار استقبال طلبات الأطباء.</p></div><button class="icon-btn" id="closeRecipientPicker" type="button" aria-label="Close"><i class="fas fa-xmark"></i></button></div><div class="recipient-search"><input id="recipientSearchInput" maxlength="80" autocomplete="off" dir="auto" placeholder="ابحث بالاسم أو التخصص أو المدينة"><button class="btn btn-secondary" id="recipientSearchBtn" type="button"><i class="fas fa-search"></i><span id="recipientSearchLabel">بحث</span></button></div><div id="recipientResults" class="recipient-results"></div></section>
    </main>
    <footer class="site-footer" id="siteFooter"></footer><div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>
    <script src="../src/utils/dom.js"></script><script src="../src/utils/format.js"></script><script src="../src/utils/store.js"></script><script src="../src/utils/motion.js"></script><script src="../src/js/api.js"></script><script src="../src/js/i18n.js"></script><script src="../src/js/theme.js"></script><script src="../src/js/toast.js"></script><script src="../src/js/layout.js"></script><script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.8.3/dist/socket.io.min.js"></script><script src="../src/js/direct-messages.js"></script>
    <script src="../src/js/pages/direct-messages.js"></script>
</body>
</html>
