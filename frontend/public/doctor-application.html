<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MedOrbit – طلب الانضمام كطبيب</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../src/css/main.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/forms.css">
    <link rel="stylesheet" href="../src/css/doctor-applications.css">
    <!-- Fail-closed shield for this page's shell. Inline on purpose: the gate
         below is an external file and an external file can 404, be blocked or
         time out, and a gate that never loads hides nothing. These lines
         cannot go missing on their own. They hide protected markup from the
         first paint; the gate clears the attribute once it has verified the
         session, and the watchdog leaves for Home if the gate never arrives. -->
    <style>html[data-auth-gate="pending"] body>*:not([data-auth-ui]),html[data-auth-gate="blocked"] body>*:not([data-auth-ui]){visibility:hidden!important}html[data-auth-gate="pending"] body,html[data-auth-gate="blocked"] body{overflow:hidden!important;background:var(--bg,#F9FAFB)!important}</style>
    <script>(function(){document.documentElement.setAttribute('data-auth-gate','pending');function f(){if(window.__medorbitAuthGateReady||window.__medorbitNavigatingAway)return;location.replace('home.html?auth=unavailable&next='+encodeURIComponent(location.pathname.split('/').pop()+location.search));}window.addEventListener('load',function(){setTimeout(f,0);});setTimeout(f,20000);})();</script>
    <!-- Global authentication gate: must load in <head>, before any
         protected markup is parsed (see frontend/src/js/auth-gate.js). -->
    <script src="../src/js/auth-gate.js"></script>
</head>
<body class="site-page" data-theme="light">
  <a class="skip-link" href="#main-content" data-i18n="a11y.skipToContent">تجاوز إلى المحتوى الرئيسي</a>
    <header class="app-header">
        <a class="header-brand" id="brandLink" href="home.html">
            <div class="brand-icon"><i class="fas fa-heartbeat"></i></div>
            <div class="brand-text"><span class="brand-name">MedOrbit</span><p>Smart Healthcare AI</p></div>
        </a>
        <nav class="site-nav" id="navLinks"></nav>
        <div class="header-actions">
            <div class="auth-area" id="authArea"></div>
            <button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
            <button class="icon-btn" id="langToggle"><span id="langLabel">EN</span></button>
        </div>
    </header>

    <main id="main-content" class="page-container application-shell">
        <section class="application-hero">
            <div>
                <h1>طلب الانضمام كطبيب / Apply as a Doctor</h1>
                <p class="text-muted">قدّم بياناتك المهنية للمراجعة الإدارية. تبقى صلاحياتك كمريض حتى الموافقة.</p>
            </div>
            <a class="btn btn-secondary" href="profile.html"><i class="fas fa-arrow-right"></i> الحساب</a>
        </section>
        <div id="applicationAlert" class="alert"></div>
        <div id="applicationLoading" class="loading-state"><div class="spinner spinner-lg"></div></div>
        <section id="applicationState" class="card application-card hidden"></section>
        <section id="applicationFormCard" class="card application-card hidden">
            <h2>البيانات المهنية / Professional information</h2>
            <form id="doctorApplicationForm" novalidate>
                <div class="application-grid">
                    <div class="form-group">
                        <label for="specialtyId">التخصص / Specialty *</label>
                        <select id="specialtyId" required><option value="">اختر التخصص</option></select>
                    </div>
                    <div class="form-group">
                        <label for="licenseNumber">رقم الترخيص الطبي / Medical license *</label>
                        <input id="licenseNumber" required maxlength="255">
                    </div>
                    <div class="form-group">
                        <label for="subSpecialty">التخصص الدقيق / Sub-specialty</label>
                        <input id="subSpecialty" maxlength="255">
                    </div>
                    <div class="form-group">
                        <label for="experience">سنوات الخبرة / Years of experience</label>
                        <input id="experience" type="number" min="0" max="80">
                    </div>
                    <div class="form-group full">
                        <label for="education">التعليم / Education <small>(سطر لكل مؤهل)</small></label>
                        <textarea id="education" rows="3"></textarea>
                    </div>
                    <div class="form-group full">
                        <label for="certifications">الشهادات / Certifications <small>(سطر لكل شهادة)</small></label>
                        <textarea id="certifications" rows="3"></textarea>
                    </div>
                    <div class="form-group full">
                        <label for="bio" data-i18n="doctorApplication.bio">النبذة المهنية</label>
                        <textarea id="bio" rows="4" dir="auto"
                                  data-i18n-placeholder="doctorApplication.bioPlaceholder"
                                  placeholder="اكتب نبذتك المهنية بالعربية أو الإنجليزية أو كليهما"></textarea>
                    </div>
                </div>
                <div class="application-actions">
                    <button id="submitApplication" class="btn btn-primary" type="submit">
                        <i class="fas fa-paper-plane"></i> إرسال الطلب / Submit
                    </button>
                </div>
            </form>
        </section>
        <section id="applicationHistoryCard" class="card application-card hidden">
            <h2>سجل الطلبات / Application history</h2>
            <div id="applicationHistory" class="application-history"></div>
        </section>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>
    <div class="toast-container" id="toastContainer"></div>
    <script src="../src/utils/store.js"></script>
    <script src="../src/js/api.js"></script>
    <script src="../src/js/i18n.js"></script>
    <script src="../src/js/theme.js"></script>
    <script src="../src/js/toast.js"></script>
    <script src="../src/js/layout.js"></script>
    <script src="../src/js/doctor-application.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Layout.init();
            DoctorApplication.init();
        });
    </script>
</body>
</html>
