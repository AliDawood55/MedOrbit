server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # Bare "/" is a convenience redirect to the app's actual entry point —
    # the site has always been accessed at /public/*.html (see python
    # http.server usage this replaces), that access pattern is unchanged.
    location = / {
        return 302 /public/index.html;
    }

    # No build step, no cache-busted filenames (see Dockerfile) — every .html/
    # .js/.css is edited and redeployed in place under the same URL. Without
    # an explicit Cache-Control, browsers apply heuristic caching off
    # Last-Modified and can keep serving a stale copy from disk for a long
    # time without ever asking the server again, so a real fix on the server
    # can look like it "didn't work" until a hard-refresh. Forcing
    # revalidation on every load (not "no caching" — ETag/Last-Modified still
    # allow a cheap 304) keeps that in sync at negligible cost.
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
