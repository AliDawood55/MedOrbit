# Central indexing policy (Phase 5 P5B2) — deny-by-default so a new protected
# page inherits "noindex, nofollow" the day it is created, without anyone
# having to remember to add a meta tag to it. Only the two explicit
# classifications below are ever more permissive, mirroring auth-gate.js's
# PUBLIC_HOME / AUTH_FLOW / PROTECTED split. Literal $uri entries are matched
# before the regex entries regardless of source order, so home.html and the
# auth pages always win over the blanket .js$/.css$ regexes.
map $uri $medorbit_robots {
    default "noindex, nofollow";

    /public/home.html "index, follow";

    /public/login.html "noindex, follow";
    /public/register.html "noindex, follow";
    /public/forgot-password.html "noindex, follow";
    /public/reset-password.html "noindex, follow";
    /public/verify-email.html "noindex, follow";

    # Empty value: add_header sends no header at all for it, so JS/CSS never
    # receive X-Robots-Tag.
    ~*\.js$ "";
    ~*\.css$ "";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

# Compression for this no-build static frontend.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/xml
    image/svg+xml;

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://accounts.google.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https: http:; connect-src 'self' http://$host:3001 http://localhost:3001 http://127.0.0.1:3001 http://[::1]:3001 https://tile.openstreetmap.org https://router.project-osrm.org https://accounts.google.com https://www.google.com; frame-src https://accounts.google.com https://www.google.com; media-src 'self' data: blob:; worker-src 'self' blob:;" always;    add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(), fullscreen=(self), payment=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Bare "/" is a convenience redirect to the app's actual entry point â€” the
    # site has always been accessed at /public/*.html (see python http.server
    # usage this replaces), that access pattern is unchanged.
    location = / {
        return 302 /public/home.html;
    }

    # No build step, no cache-busted filenames (see Dockerfile) â€” every .html/
    # .js/.css is edited and redeployed in place under the same URL. Without
    # an explicit Cache-Control, browsers apply heuristic caching off
    # Last-Modified and can keep serving a stale copy from disk for a long
    # time without ever asking the server again, so a real fix on the server
    # can look like it "didn't work" until a hard-refresh. Forcing
    # revalidation on every load (not "no caching" â€” ETag/Last-Modified still
    # allow a cheap 304) keeps that in sync at negligible cost.
    location ~* \.(?:html|js|css)$ {
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://accounts.google.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https: http:; connect-src 'self' http://$host:3001 http://localhost:3001 http://127.0.0.1:3001 http://[::1]:3001 https://tile.openstreetmap.org https://router.project-osrm.org https://accounts.google.com https://www.google.com; frame-src https://accounts.google.com https://www.google.com; media-src 'self' data: blob:; worker-src 'self' blob:;" always;
        add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(), fullscreen=(self), payment=()" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $medorbit_robots always;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
