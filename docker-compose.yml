# MedOrbit — local Docker Compose stack
#
# Services: postgres (postgis/postgis), backend (Node/Express), ai-service
# (FastAPI), frontend (nginx, static files). Ollama is intentionally NOT a
# service here — see the ai-service block below.
#
# All application env vars come from the single .env at the project root
# (docker-compose reads it automatically for ${VAR} interpolation below, and
# each service's `env_file: .env` injects the same values into the container
# at runtime). Only the handful of values that must differ *inside* the
# container network are overridden per-service under `environment:` —
# everything else (JWT_SECRET, EMAIL_*, GOOGLE_CLIENT_ID, CORS_ORIGIN,
# FRONTEND_URL, etc.) passes through unchanged from .env.
#
# DATABASE BOOTSTRAP — deliberately explicit, never automatic on `up`.
# Migrations 001+ alter tables from the historical MedOrbit schema, so a fresh
# database must first receive the tracked schema-only baseline. Run
# `npm run db:bootstrap` once after postgres is healthy, then `npm run
# db:migrate`. The bootstrap service is a no-op for an initialized database and
# refuses a suspicious partial medorbit schema rather than guessing.
#
# OLLAMA — deliberately NOT a service here. The model is ~4GB and is meant to
# run once on the host, shared by everything on that machine, not rebuilt
# per-project. ai-service reaches it via Docker Desktop's built-in
# host.docker.internal DNS name (Windows/Mac); extra_hosts below adds the
# same mapping on Linux, where it isn't automatic.

services:
  postgres:
    # PG18, not 16 — the medorbit_backup.backup file was made with pg_dump
    # from PostgreSQL 18 (pgAdmin on the host), and pg_restore refuses to
    # restore a newer-major-version dump into an older server ("unsupported
    # version"). Confirmed via Docker Hub's API that 18-3.6 is the current
    # stable (non-RC, non-alpine) postgis/postgis tag for PG18.
    image: postgis/postgis:18-3.6
    container_name: medorbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Explicit subdirectory, not the volume's mount root directly — avoids
      # Postgres tripping over a pre-existing lost+found dir on some volume
      # drivers.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - medorbit_pgdata:/var/lib/postgresql/data
    ports:
      # Dedicated loopback-only host endpoint for pgAdmin and host-side tools.
      # Keep DB_PORT=5432 for container-to-container PostgreSQL connections.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:3.9.0
    container_name: medorbit-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - medorbit_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: medorbit-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the compose network, "postgres" is the service's DNS name —
      # localhost (the .env default, correct when running on the host) would
      # resolve to the backend container itself, not the DB.
      DB_HOST: postgres
      DB_PORT: 5432
      # Same reasoning: the ai-service container, not localhost.
      AI_SERVICE_URL: http://ai-service:8001
      # pino-pretty (dev-only log formatter) is a devDependency and isn't in
      # this image (npm ci --omit=dev) — logger.js falls back to plain JSON
      # logging when NODE_ENV=production, which is also the more standard
      # format for container log collectors. The .env default (development)
      # is correct for running the backend directly on the host.
      NODE_ENV: production
      KAFKA_ENABLED: "true"
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # server.js runs from /app/backend, so both paths must live below that
      # working directory. Mounting /app/uploads previously left the actual
      # runtime directories inside the container layer, where rebuilds erased
      # avatars, record attachments, and generated reports.
      - ./backend/uploads:/app/backend/uploads
      - ./backend/storage:/app/backend/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  outbox-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: medorbit-outbox-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      NODE_ENV: production
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: kafka:9092
      WORKER_HEALTH_PORT: 3002
    command: ["node", "scripts/outbox-worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  event-consumer:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: medorbit-event-consumer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      NODE_ENV: production
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: kafka:9092
      WORKER_HEALTH_PORT: 3003
    command: ["node", "scripts/event-consumer.js"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      outbox-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3003/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  recommendation-consumer:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: medorbit-recommendation-consumer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      NODE_ENV: production
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: kafka:9092
      KAFKA_RECOMMENDATION_CONSUMER_GROUP: recommendation-profile-v1
      WORKER_HEALTH_PORT: 3004
    command: ["node", "scripts/recommendation-consumer.js"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      outbox-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3004/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  test-db-init:
    image: postgis/postgis:18-3.6
    profiles: ["test"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      SOURCE_DB_NAME: ${DB_NAME}
      TEST_DB_NAME: medorbit_test
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts/init-test-database.sh:/usr/local/bin/init-test-database.sh:ro
    entrypoint: ["bash", "/usr/local/bin/init-test-database.sh"]

  backend-test:
    image: medorbit-backend-test
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    profiles: ["test"]
    container_name: medorbit-backend-test
    restart: "no"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: medorbit_test
      DB_SCHEMA: medorbit
      NODE_ENV: test
      MEDORBIT_TEST_ISOLATION: docker
      PORT: 3001
      AI_SERVICE_URL: http://ai-service-test:8001
      # The per-minute fair-use limiter and the 20-per-24h free quota are
      # different mechanisms that happen to share a number in production.
      # Raised here so the quota tests measure the quota rather than tripping
      # the burst limiter first.
      BILLING_FAIR_USE_CHAT_PER_MINUTE: 500
      # Sandbox billing. Scoped to this test-profile service and nowhere
      # else: the runtime `backend` service carries none of these, and a
      # process with NODE_ENV=production refuses to boot if it ever does
      # (assertProviderConfigSafe in backend/src/config/billing.js).
      #
      # Both variables are required to enable the sandbox, so neither one
      # arriving by accident is enough to turn on simulated payments.
      BILLING_PROVIDER: mock
      BILLING_MOCK_ENABLED: "true"
      # Read from the environment when present. The fallback exists so the
      # suite runs on a clean checkout; it can only ever be used by a mock
      # provider that cannot exist in production.
      BILLING_MOCK_WEBHOOK_SECRET: ${BILLING_MOCK_WEBHOOK_SECRET:-medorbit_sandbox_only_secret_not_for_production}
      KAFKA_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      test-db-init:
        condition: service_completed_successfully
      ai-service-test:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  db-migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    profiles: ["tools"]
    restart: "no"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_SCHEMA: medorbit
      NODE_ENV: migration
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["node", "scripts/migrate.js"]
    command: ["status"]

  db-bootstrap:
    image: postgis/postgis:18-3.6
    profiles: ["tools"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      BASELINE_SQL: /bootstrap/base-schema.sql
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts/bootstrap-database.sh:/usr/local/bin/bootstrap-database.sh:ro
      - ./scripts/ci/base-schema.sql:/bootstrap/base-schema.sql:ro
    entrypoint: ["bash", "/usr/local/bin/bootstrap-database.sh"]

  ai-service:
    build:
      # Root context: requirements.txt lives at the project root, not inside
      # ai-service/ (see DOCKER.md).
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: medorbit-ai-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      # host.docker.internal reaches the HOST machine from inside the
      # container — this is where `ollama serve` is expected to already be
      # running (see README note in the Ollama section above).
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
    extra_hosts:
      # Docker Desktop (Windows/Mac) provides host.docker.internal
      # automatically; this line is what makes the same name resolve on
      # Linux, where it otherwise doesn't exist. Harmless no-op on Desktop.
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      # Whisper weights (~1.5GB for 'medium') download into the HuggingFace
      # cache on first transcription. Without this volume that cache lives in
      # the container's writable layer and is destroyed by every rebuild —
      # measured: the first Arabic request after `up --build` took 217s, versus
      # 3.8s once resident. Persisting it also means the ar/en models survive
      # switching between the CPU and GPU overlays.
      - medorbit_hf_cache:/root/.cache/huggingface

  ai-service-test:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    image: medorbit-ai-service-test
    profiles: ["test"]
    restart: "no"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: medorbit_test
      DB_SCHEMA: medorbit
      NODE_ENV: test
      MEDORBIT_TEST_ISOLATION: docker
      # Keep the FastAPI service on its Dockerfile default.  The test backend
      # reaches it by the compose service name, never through a host port.
    depends_on:
      postgres:
        condition: service_healthy
      test-db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)\" || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: medorbit-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  medorbit_pgdata:
    name: medorbit_pgdata
  medorbit_kafka_data:
    name: medorbit_kafka_data
  medorbit_hf_cache:
    name: medorbit_hf_cache
